# =====================================================================================
# Reverse proxy
# =====================================================================================
#
# Sits in front of the API and the web app. Two things it does that matter
# financially:
#
#   1. Webhook bodies are streamed untouched. Any transformation (JSON re-encoding,
#      whitespace trimming) invalidates the provider's HMAC signature, so those
#      routes disable buffering-side effects and pass the body through verbatim.
#   2. The webhook location gets its own upstream and a generous limit, because a
#      provider's redelivery storm must not be throttled into a lost payment event.
# =====================================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The request id is generated by the application; nginx only makes sure one is
    # always present so logs on both sides can be joined.
    map $http_x_request_id $request_id_final {
        default   $http_x_request_id;
        ""        $request_id;
    }

    log_format json_combined escape=json
      '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id_final",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"referrer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
      '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 25m;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain application/xml;
    gzip_min_length 1024;

    # ---------------------------------------------------------------------------
    # Rate limiting zones
    # ---------------------------------------------------------------------------
    # Bounded by client address. The login zone is deliberately tight; the webhook
    # zone exists only to stop an unbounded flood, not to police the provider.
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=webhooks:10m rate=50r/s;
    limit_req_status 429;

    upstream fee_api {
        server api:4000;
        keepalive 32;
    }

    upstream fee_web {
        server web:3000;
        keepalive 32;
    }

    server {
        listen 80;
        # DNS must cover platform.TENANT_BASE_DOMAIN and *.TENANT_BASE_DOMAIN. This
        # host-agnostic vhost preserves $host for API-side validation.
        server_name _;

        # In production this server block only redirects; TLS is terminated here
        # and forwarded over the internal network.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        # The mounted wildcard certificate must cover the platform and tenant hosts.
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # -----------------------------------------------------------------------
        # Payment provider webhooks
        # -----------------------------------------------------------------------
        # `proxy_request_buffering off` streams the body so the exact bytes the
        # provider signed reach the application for signature verification.
        location /api/v1/webhooks/ {
            limit_req zone=webhooks burst=200 nodelay;

            proxy_pass http://fee_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $request_id_final;

            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location ~ ^/api/v1/auth/(login|refresh)$ {
            limit_req zone=api_auth burst=10 nodelay;

            proxy_pass http://fee_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $request_id_final;
        }

        location /api/ {
            limit_req zone=api_general burst=60 nodelay;

            proxy_pass http://fee_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id      $request_id_final;
            proxy_read_timeout 120s;
        }

        # Health is unversioned and unauthenticated so a load balancer can poll it.
        location /health {
            proxy_pass http://fee_api;
            proxy_set_header Host $host;
            access_log off;
        }

        location /api/docs {
            proxy_pass http://fee_api;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://fee_web;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
        }
    }
}
